[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue lanes (App\Enums\OpsLane). stopwaitsecs lets a running job finish on
; deploy or restart instead of being killed after supervisord's default 10 s;
; docker-compose.coolify.yml stop_grace_period must stay above the largest one.
[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --queue=critical,default --sleep=1 --tries=3 --max-time=3600 --timeout=170
autostart=true
autorestart=true
priority=30
stopsignal=TERM
stopwaitsecs=180
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-health]
command=php /var/www/html/artisan queue:work redis --queue=health --sleep=1 --tries=1 --max-time=3600 --timeout=80
autostart=true
autorestart=true
priority=31
stopsignal=TERM
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Jobs here may run for up to 15 minutes; one still running after stopwaitsecs is
; killed and picked up again by the watchdog / its own reconcile.
[program:queue-long]
command=php /var/www/html/artisan queue:work redis-long --queue=long --sleep=3 --tries=1 --max-time=3600 --timeout=950
autostart=true
autorestart=true
priority=32
stopsignal=TERM
stopwaitsecs=320
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
