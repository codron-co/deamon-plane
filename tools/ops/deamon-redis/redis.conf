# Shared Redis for Deamon sites. Only reachable on the deamon-db Docker network; every
# client must authenticate (ACL file below, the default user is off).
bind * -::*
protected-mode no
port 6379
aclfile /data/users.acl

# Site isolation: each site gets its own user (key pattern = its prefix) and its own DB pair
# (N for queue/session/locks, N+1 for cache); 1024 DBs = 511 sites (0/1 unused).
databases 1024

# Every site key has a TTL except queued jobs; volatile-lru evicts only TTL keys, so a full
# memory can never drop a queued job. Expected use ~3 MB per site; alert at 70%.
maxmemory 1gb
maxmemory-policy volatile-lru

dir /data
appendonly yes
appendfsync everysec
save 900 1

maxclients 10000
timeout 300
tcp-keepalive 60
slowlog-log-slower-than 10000
slowlog-max-len 256
